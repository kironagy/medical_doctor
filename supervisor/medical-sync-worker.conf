; ═══════════════════════════════════════════════════════════════════════════════
; Medical Plus — Supervisor Queue Worker Configuration
; ═══════════════════════════════════════════════════════════════════════════════
;
; Installation:
;   sudo cp supervisor/medical-sync-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start medical-sync-worker:*
;
; Monitor:
;   sudo supervisorctl status
;   sudo supervisorctl tail -f medical-sync-worker:medical-sync-worker_00 stdout
;
; After deployment (new code):
;   php artisan queue:restart
;   sudo supervisorctl restart medical-sync-worker:*

[program:medical-sync-worker]
; ── Command ──────────────────────────────────────────────────────────────────
; Processes the 'sync' queue first, then falls back to 'default'.
; --max-time=3600  : Worker recycles after 1 hour (prevents memory drift).
; --memory=256     : Restart if worker exceeds 256MB (large file payloads).
; --sleep=3        : Poll interval when queue is empty (seconds).
; --tries=3        : Laravel-level job retry count before marking failed.
; --timeout=3600   : Job timeout must match ProcessSyncJob::$timeout.
command=/usr/bin/php /var/www/html/artisan queue:work database --queue=sync,default --sleep=3 --tries=3 --max-time=3600 --memory=256 --timeout=3600

; ── Process management ───────────────────────────────────────────────────────
; numprocs=2: Two concurrent workers.
;   Worker 00 processes 'sync' queue (large patient uploads).
;   Worker 01 handles spillover and any 'default' queue jobs.
numprocs=2
process_name=%(program_name)s_%(process_num)02d

; ── Auto-restart ─────────────────────────────────────────────────────────────
autostart=true
autorestart=true

; Give workers up to 1 hour to finish a running sync job before force-killing.
; This MUST be >= queue:work --timeout to prevent mid-job termination.
stopwaitsecs=3600
stopsignal=TERM

; ── User ─────────────────────────────────────────────────────────────────────
; Run as the web server user. Adjust to 'nginx' or 'ubuntu' as needed.
user=www-data

; ── Logging ──────────────────────────────────────────────────────────────────
redirect_stderr=true
stdout_logfile=/var/log/supervisor/medical-sync-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; ── Environment ──────────────────────────────────────────────────────────────
; Ensure the correct .env is loaded. Adjust path to match server deployment.
environment=HOME="/var/www/html",USER="www-data"
